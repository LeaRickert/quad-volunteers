# Optional: reproducible local Postgres.
# You currently run a standalone container named `my-postgres` on port 5432.
# Only start this one (`npm run db:up`) if that container is stopped,
# otherwise the two will fight over port 5432.
services:
  db:
    image: postgres:17
    container_name: quad-volunteers-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: quad_volunteers
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
